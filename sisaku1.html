<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#ffffff" />
	<meta name="description" content="フィーリングコレクション - あなたの気分や顔タイプに合わせたコーディネート提案アプリ" />
	<title>フィーリングコレクション - プロトタイプ</title>
	<link rel="stylesheet" href="css/sisaku1.css">
	<!-- Dexie.js CDN -->
	<script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
	<!-- サイトヘッダー：アプリ名表示 -->
	<header class="site-header">
		<h1>フィーリングコレクション（プロトタイプ）</h1>
	</header>

	<main class="container">
		<!-- 気候表示セクション
				 - 位置情報を用いて天気APIから現在の気温・風速などを取得して表示します
				 - ボタンで手動更新が可能 -->
		<section id="weatherSection" class="card">
			<h2>現在の気候</h2>
			<div id="weather">位置情報と気候を取得しています…</div>
			<div id="weatherSource" class="weather-source">データソース: 自動取得</div>
			<button id="refreshWeather">天気を更新</button>
		</section>

		<!-- 気分・シーン選択セクション
				 - ボタンで選んだ気分はローカルストレージに保存され、提案に利用されます -->
		<section id="moodSection" class="card">
			<h2>気分・シーンを選ぶ</h2>
			<div id="moodButtons" class="chips">
				<button data-mood="普段">普段</button>
				<button data-mood="仕事">仕事</button>
				<button data-mood="休日">休日</button>
				<button data-mood="デート">デート</button>
				<button data-mood="リラックス">リラックス</button>
				<button data-mood="オフィスカジュアル">オフィスカジュアル</button>
				<button data-mood="フォーマル">フォーマル</button>
			</div>
		</section>

		<!-- ナビゲーション（各機能への移動） -->
		<section id="navSection" class="card">
			<h2>機能</h2>
			<div class="nav-buttons">
				<!-- 各ボタンはJSで対応セクションを表示します -->
				<button id="toFace">顔タイプを測る</button>
				<button id="toCloset">クローゼットを見る</button>
				<button id="toPropose">コーデを提案してもらう</button>
			</div>
		</section>

		<!-- 顔タイプ判別（簡易実装）
				 - カメラ映像を表示し、撮影して顔縦横比から簡易判定を行う
				 - 判定結果はlocalStorageに保存 -->
		<section id="faceSection" class="card hidden">
			<h2>顔タイプ判別（簡易）</h2>
			<video id="camera" autoplay playsinline></video>
			<canvas id="faceCanvas" class="hidden"></canvas>
			<div class="face-controls">
				<button id="startCamera">カメラ開始</button>
				<button id="captureFace">撮影して判定</button>
				<button id="stopCamera">カメラ停止</button>
				<label class="face-upload">写真から判定<input id="faceImage" type="file" accept="image/*"></label>
			</div>
			<div id="faceResult">判定結果：未実行</div>
			<div id="faceMetrics" aria-live="polite"></div>
			<small id="faceNotice">カメラまたは端末の写真から判定できます。判定処理は端末内で行われます。</small>
		</section>

		<!-- クローゼット（手持ち服の登録）
				 - 画像ファイルを選択してローカルストレージに保存し、グリッドで表示 -->
		<section id="closetSection" class="card hidden">
			<h2>クローゼット（手持ち服）</h2>
			<form id="closetForm" class="closet-form">
				<label class="closet-image-field" for="addCloth">服の写真
					<input id="addCloth" type="file" accept="image/*" required>
				</label>
				<label>服の名前
					<input id="clothName" type="text" maxlength="40" placeholder="例：白いシャツ" required>
				</label>
				<label>カテゴリ
					<select id="clothCategory" required>
						<option value="トップス">トップス</option>
						<option value="ワンピース">ワンピース</option>
						<option value="アウター">アウター</option>
						<option value="ボトムス">ボトムス</option>
						<option value="スカート">スカート</option>
						<option value="帽子">帽子</option>
						<option value="靴">靴</option>
						<option value="アクセサリー">アクセサリー</option>
					</select>
				</label>
				<label>季節
					<select id="clothSeason" required>
						<option value="通年">通年</option>
						<option value="春">春</option>
						<option value="夏">夏</option>
						<option value="秋">秋</option>
						<option value="冬">冬</option>
						<option value="春夏">春夏</option>
						<option value="春秋">春秋</option>
						<option value="春冬">春冬</option>
						<option value="夏秋">夏秋</option>
						<option value="夏冬">夏冬</option>
						<option value="秋冬">秋冬</option>
						<option value="春夏秋">春夏秋</option>
						<option value="春夏冬">春夏冬</option>
						<option value="春秋冬">春秋冬</option>
						<option value="夏秋冬">夏秋冬</option>
					</select>
				</label>
				<label>シーン
					<select id="clothScene" required>
						<option value="普段着">普段着</option>
						<option value="仕事">仕事</option>
						<option value="休日">休日</option>
						<option value="デート">デート</option>
						<option value="フォーマル">フォーマル</option>
					</select>
				</label>
				<button type="submit">服を登録</button>
				<p id="closetStatus" class="closet-status" aria-live="polite"></p>
				<p id="dexieStatus" class="storage-status" aria-live="polite">Dexie: 初期化中…</p>
			</form>
			<div id="closetGrid" class="grid"></div>
		</section>

		<!-- コーデ提案セクション
				 - 登録済みの服画像から簡易的に組み合わせを作成し、アドバイス文を表示 -->
		<section id="proposeSection" class="card hidden">
			<h2>コーディネート提案</h2>
			<div id="proposal"></div>
			<div id="advice" class="advice"></div>
			<button id="makeProposal">提案を作る</button>
		</section>

	</main>

	<!-- プロトタイプ用のJS: 天気取得、気分選択、カメラ、クローゼット、提案処理 -->
	<script src="js/sisaku1.js"></script>
</body>
</html>
